[workspace]
members = ["crates/cacp", "crates/proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/crabtalk/cacp"

[workspace.dependencies]
proto = { path = "crates/proto", package = "cacp-proto", version = "0.1.0" }

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
