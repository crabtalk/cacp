[workspace]
members = ["crates/agents", "crates/cacp", "crates/events", "crates/interop", "crates/proto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/crabtalk/cacp"
homepage = "https://crabtalk.github.io/cacp/"

[workspace.dependencies]
proto = { path = "crates/proto", package = "cacp-proto", version = "0.1.0" }
cacp = { path = "crates/cacp", version = "0.1.0", default-features = false }

anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false }
ureq = "3"
which = "8"
