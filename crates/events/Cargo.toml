[package]
name = "cacp-events"
description = "A channel-based ACP client for cacp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cacp-events"
readme = "../../README.md"
keywords = ["acp", "agent", "protocol", "client", "async"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
cacp = { workspace = true, features = ["client"] }
proto.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
