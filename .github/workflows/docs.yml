name: Deploy Docs

# The book carries the guide; rustdoc goes alongside it at /api so API
# documentation is generated from the source and cannot drift from it.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The book includes the examples by reference, and rustdoc comes from the
      # sources, so both invalidate the published site.
      - "crates/*/src/**"
      - "crates/cacp/examples/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"

      - run: mdbook build docs

      - name: build the API documentation
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

      - name: place the API documentation under /api
        run: |
          mv target/doc docs/book/api
          # rustdoc emits no root index, so send /api to the main crate.
          echo '<meta http-equiv="refresh" content="0;url=cacp/index.html">' \
            > docs/book/api/index.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/book
